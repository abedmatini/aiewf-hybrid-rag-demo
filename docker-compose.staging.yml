##############################################################################
# FAQ Agentic — Staging Docker Compose
#
# Services:
#   db        — PostgreSQL 16 + pgvector
#   ollama    — LLM inference (CPU-only on GT730 — 2 GB VRAM insufficient)
#   api       — FastAPI backend (port 8002)
#   ui        — React + nginx (port 80 / 443 via Plesk reverse-proxy)
#
# Usage:
#   cp .env.staging .env
#   # edit .env with your real values
#   docker compose --env-file .env up -d --build
##############################################################################

services:

  # ── PostgreSQL + pgvector ───────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: faq_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-faq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-faq_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faq} -d ${POSTGRES_DB:-faq_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama — CPU-only inference ─────────────────────────────────────────────
  # GT730 has only 2 GB DDR3 VRAM → models run on CPU (16 GB system RAM).
  # Expected speed: ~1-3 tok/s for 7B models on 8 cores.
  # To pull models after first start:
  #   docker exec -it faq_ollama ollama pull bge-m3
  #   docker exec -it faq_ollama ollama pull qwen2.5:0.5b
  #   docker exec -it faq_ollama ollama pull llama-guard3:1b
  ollama:
    image: ollama/ollama:latest
    container_name: faq_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # No `deploy.resources.reservations.devices` — GT730 VRAM too small;
    # Ollama auto-detects and falls back to CPU.
    environment:
      OLLAMA_NUM_PARALLEL: "1"        # single request at a time on limited RAM
      OLLAMA_MAX_LOADED_MODELS: "2"   # keep bge-m3 + qwen2.5 both resident
      OLLAMA_NUM_THREADS: "16"        # use all 16 vCPUs (was 4 — severe bottleneck)
      OLLAMA_KEEP_ALIVE: "-1"         # never unload models from RAM (128 GB = no reason to)
    # ports removed — API reaches Ollama via internal Docker network (ollama:11434)

  # ── Langfuse — LLM observability (optional) ────────────────────────────────
  # Access the dashboard at http://YOUR_VPS_IP:3000
  # Create a project → copy Public + Secret keys → set in .env
  # Set LANGFUSE_HOST=http://langfuse:3000 in .env to enable tracing.
  langfuse-db:
    image: postgres:15-alpine
    container_name: faq_langfuse_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER:     langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
      POSTGRES_DB:       langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: faq_langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL:      "postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/langfuse"
      NEXTAUTH_URL:      ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET:   ${LANGFUSE_NEXTAUTH_SECRET:-changeme-nextauth-secret}
      SALT:              ${LANGFUSE_SALT:-changeme-salt}
      TELEMETRY_ENABLED: "false"

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: faq-api:staging
    container_name: faq_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DATABASE_URL:                "postgresql://${POSTGRES_USER:-faq}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-faq_db}"
      OLLAMA_URL:                  "http://ollama:11434"
      # Per-deployment domain pack: health | hr | ecommerce (one per install).
      DOMAIN:                      ${DOMAIN:-health}
      # Optional Tier-3 guard model (e.g. llama-guard3). Blank/none = disabled.
      GUARD_MODEL:                 ${GUARD_MODEL:-}
      EMBED_MODEL:                 ${EMBED_MODEL:-bge-m3:latest}
      EMBED_DIM:                   ${EMBED_DIM:-1024}
      CHAT_MODEL:                  ${CHAT_MODEL:-qwen2.5:0.5b}
      CLASSIFIER_MODEL:            ${CLASSIFIER_MODEL:-qwen2.5:0.5b}
      CORS_ORIGINS:                ${CORS_ORIGINS:-http://localhost}
      KB_USER_ID:                  ${KB_USER_ID:-faq_kb}
      OLLAMA_NUM_CTX:              ${OLLAMA_NUM_CTX:-4096}
      CHITCHAT_DISTANCE_THRESHOLD: ${CHITCHAT_DISTANCE_THRESHOLD:-0.70}
      MAX_HISTORY:                 ${MAX_HISTORY:-10}
      API_KEY:                     ${API_KEY:-}
      AGENT_MODEL:                 ${AGENT_MODEL:-qwen2.5:0.5b}
      MAX_AGENT_ITERATIONS:        ${MAX_AGENT_ITERATIONS:-5}
      RERANKER_MODEL:              ${RERANKER_MODEL:-}
      LANGFUSE_PUBLIC_KEY:         ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY:         ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST:               ${LANGFUSE_HOST:-}
    volumes:
      - ./api/uploads:/app/uploads
    ports:
      - "8002:8002"                 # optional: remove if only accessed via UI proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React UI (nginx) ────────────────────────────────────────────────────────
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL:              ${VITE_API_URL:-/api}
        VITE_PRIVACY_POLICY_URL:   ${VITE_PRIVACY_POLICY_URL:-https://example.com/privacy}
        VITE_GA4_ID:               ${VITE_GA4_ID:-}
    image: faq-ui:staging
    container_name: faq_ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  pgdata:
  ollama_data:
  langfuse_pgdata:
