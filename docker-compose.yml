##############################################################################
# AIEWF Hybrid RAG Demo — local Postgres + pgvector (and optional Langfuse)
#
# The API and UI run natively (uvicorn / vite), not in containers, so they
# can reach Ollama on the host at http://localhost:11434. This file only
# starts the stateful services. For a fully containerized deploy (API + UI
# + Ollama in Docker too), see docker-compose.staging.yml instead.
#
# Usage:
#   docker compose up -d                            # Postgres only
#   docker compose --profile observability up -d     # + Langfuse dashboard
##############################################################################

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aiewf_demo_postgres
    environment:
      POSTGRES_USER: chainlit
      POSTGRES_PASSWORD: chainlit
      POSTGRES_DB: chainlit_db
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlit -d chainlit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Langfuse — optional LLM observability dashboard ─────────────────────
  # docker compose --profile observability up -d
  langfuse-db:
    image: postgres:15-alpine
    container_name: aiewf_demo_langfuse_pg
    profiles: ["observability"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: aiewf_demo_langfuse
    profiles: ["observability"]
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: langfuse-nextauth-secret-change-me
      SALT: langfuse-salt-change-me
      TELEMETRY_ENABLED: "false"
    restart: unless-stopped

volumes:
  pgdata:
  langfuse_pgdata:
